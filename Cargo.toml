[package]
name = "handl-host-tensor"
version = "0.1.0"
edition = "2024"
description = "Host-side tensor functions for handl runtimes — an n-d dense array (f64) behind the `tensor.*` op surface."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/host-tensor"

[dependencies]
# ADR-0128 §Resolution: platform + lib-ops come from the sibling checkouts for
# local development (see the `[patch]` tables); CI resolves the git sources.
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-lib-ops = { git = "https://github.com/handl-lang/lib-ops", branch = "main" }
serde_json = "1"

[dev-dependencies]
handl-plugin-module = { git = "https://github.com/handl-lang/platform", branch = "main" }
# Engine round-trip test (`tests/engine_roundtrip.rs`): run a `.hnl` program
# through the real `lex → parse → eval` pipeline so `tensor.*` host results
# decode to `TaggedValue::Tensor` inside the engine — not just across the
# `serde_json::Value` module chain `tests/compose.rs` covers.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }

[patch."https://github.com/handl-lang/kernel"]
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/platform"]
handl-platform = { path = "../platform/crates/platform" }
handl-plugin-ext-diag = { path = "../platform/crates/plugin-ext-diag" }
handl-plugin-lib-handl = { path = "../platform/crates/plugin-lib-handl" }
handl-plugin-module = { path = "../platform/crates/plugin-module" }
handl-kit-data = { path = "../platform/crates/handl-kit-data" }
handl-runtime = { path = "../platform/crates/handl-runtime" }

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/engine-exec"]
hnl-engine-exec = { path = "../engine-exec" }

[patch."https://github.com/handl-lang/engine-exec-bytecode"]
hnl-engine-exec-bytecode = { path = "../engine-exec-bytecode" }

[patch."https://github.com/handl-lang/engine-exec-tree-walk"]
hnl-engine-exec-tree-walk = { path = "../engine-exec-tree-walk" }

[patch."https://github.com/handl-lang/engine-lex"]
hnl-engine-lex = { path = "../engine-lex" }

[patch."https://github.com/handl-lang/engine-lint"]
hnl-engine-lint = { path = "../engine-lint" }

[patch."https://github.com/handl-lang/engine-lex-pattern"]
hnl-engine-lex-pattern = { path = "../engine-lex-pattern" }

[patch."https://github.com/handl-lang/engine-parse"]
hnl-engine-parse = { path = "../engine-parse" }

[patch."https://github.com/handl-lang/engine-parse-pratt"]
hnl-engine-parse-pratt = { path = "../engine-parse-pratt" }

[patch."https://github.com/handl-lang/engine-typecheck"]
hnl-engine-typecheck = { path = "../engine-typecheck" }

[patch."https://github.com/handl-lang/engine-transform"]
hnl-engine-transform = { path = "../engine-transform" }

[patch."https://github.com/handl-lang/engine-transform-rewrite"]
hnl-engine-transform-rewrite = { path = "../engine-transform-rewrite" }

[patch."https://github.com/handl-lang/lang"]
handl-kit-data-canonical = { path = "../lang/crates/handl-kit-data-canonical" }

[patch."https://github.com/handl-lang/lib-ops"]
handl-lib-ops = { path = "../lib-ops" }