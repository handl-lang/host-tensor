# handl manifest for the `host-tensor` repo: host-side tensor functions.
#
# [dependencies] maps an import name to a package directory (ADR-0128
# Phase-5 seam: .hnl imports resolve by name, not `../` path). The repo's
# own package is declared self-referentially — under both the package name
# (`host-tensor`) and the module namespace it contributes (`tensor`) — so
# name-specs keep resolving when a dependent repo's modules are loaded
# under this manifest's context (same shape as the `c` repo's self-declared
# `libc` entries and platform's self-declared `math`/`math-c`).
[dependencies]
host-tensor = { path = "src" }
tensor      = { path = "src" }
